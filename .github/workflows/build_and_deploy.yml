name: Build and Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install and Build 🔧
        run: |
          npm ci --no-audit --no-fund
          npm run check

      - name: Add social-media files 🎬
        # Videos and stills live in a GitHub release (not in Git history); the unlisted /media page
        # serves them from the site so they get the right content types
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download social-media-2026-11 --repo ${{ github.repository }} --dir dist/media --clobber

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
